<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sail4th 250 — Free Public Viewing Areas</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --navy: #0a1628;
    --gold: #c9a84c;
    --red: #b03a2e;
    --sky: #4a90d9;
    --cream: #f5f0e8;
    --july3: #e67e22;
    --july4: #1a6b3c;
    --staging: #8e44ad;
  }

  body {
    font-family: 'Source Sans 3', sans-serif;
    background: var(--navy);
    color: var(--cream);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    background: var(--navy);
    border-bottom: 2px solid var(--gold);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    z-index: 1000;
  }

  .header-left h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.3rem;
    color: var(--gold);
    letter-spacing: 0.04em;
    line-height: 1.2;
  }

  .header-left p {
    font-size: 0.78rem;
    color: #aab;
    margin-top: 2px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .header-right {
    font-size: 0.72rem;
    color: #8899aa;
    text-align: right;
    line-height: 1.6;
  }

  #map {
    flex: 1;
    width: 100%;
  }

  /* Legend */
  .legend {
    background: rgba(10, 22, 40, 0.95);
    border: 1px solid var(--gold);
    border-radius: 6px;
    padding: 14px 16px;
    font-family: 'Source Sans 3', sans-serif;
    min-width: 220px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }

  .legend h3 {
    font-family: 'Playfair Display', serif;
    color: var(--gold);
    font-size: 0.85rem;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    border-bottom: 1px solid rgba(201,168,76,0.3);
    padding-bottom: 6px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 7px;
    font-size: 0.78rem;
    color: var(--cream);
    line-height: 1.3;
  }

  .legend-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.3);
  }

  .legend-line {
    width: 24px;
    height: 3px;
    flex-shrink: 0;
    border-radius: 2px;
  }

  .legend-section {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.1);
  }

  .legend-note {
    font-size: 0.7rem;
    color: #8899aa;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.1);
    line-height: 1.4;
  }

  /* Popup styling */
  .leaflet-popup-content-wrapper {
    background: var(--navy);
    border: 1px solid var(--gold);
    border-radius: 6px;
    color: var(--cream);
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  }

  .leaflet-popup-tip {
    background: var(--navy);
  }

  .leaflet-popup-content {
    margin: 14px 16px;
    font-family: 'Source Sans 3', sans-serif;
  }

  .popup-title {
    font-family: 'Playfair Display', serif;
    color: var(--gold);
    font-size: 0.95rem;
    margin-bottom: 5px;
    line-height: 1.3;
  }

  .popup-tag {
    display: inline-block;
    font-size: 0.65rem;
    padding: 2px 7px;
    border-radius: 10px;
    margin-bottom: 7px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .popup-body {
    font-size: 0.78rem;
    color: #ccd;
    line-height: 1.5;
  }

  .popup-cost {
    margin-top: 6px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>⛵ Sail4th 250 — Where to Watch for Free</h1>
    <p>Public Viewing Areas · July 3 &amp; 4, 2026 · Port of New York &amp; New Jersey</p>
  </div>
  <div class="header-right">
    Click any marker<br>for details
  </div>
</header>

<div id="map"></div>

<script>
  const map = L.map('map', {
    center: [40.74, -73.97],
    zoom: 12,
    zoomControl: true
  });

  // Dark nautical tile layer
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
    maxZoom: 19
  }).addTo(map);

  // Color scheme
  const colors = {
    july4: '#1a8a4c',
    july3: '#e67e22',
    both: '#4a90d9',
    staging: '#c0392b',
    govIsland: '#8e44ad'
  };

  function makeIcon(color, size = 14) {
    return L.divIcon({
      className: '',
      html: `<div style="
        width:${size}px;height:${size}px;
        background:${color};
        border:2.5px solid rgba(255,255,255,0.7);
        border-radius:50%;
        box-shadow:0 0 8px ${color}99;
      "></div>`,
      iconSize: [size, size],
      iconAnchor: [size/2, size/2],
      popupAnchor: [0, -size/2 - 4]
    });
  }

  function makeStarIcon(color) {
    return L.divIcon({
      className: '',
      html: `<div style="
        width:18px;height:18px;
        background:${color};
        border:2.5px solid rgba(255,255,255,0.85);
        border-radius:3px;
        transform:rotate(45deg);
        box-shadow:0 0 10px ${color}cc;
      "></div>`,
      iconSize: [18, 18],
      iconAnchor: [9, 9],
      popupAnchor: [0, -14]
    });
  }

  function popup(title, tag, tagColor, description, cost) {
    return `
      <div class="popup-title">${title}</div>
      <div><span class="popup-tag" style="background:${tagColor}22;color:${tagColor};border:1px solid ${tagColor}55">${tag}</span></div>
      <div class="popup-body">${description}</div>
      <div class="popup-cost" style="color:${tagColor}">${cost}</div>
    `;
  }

  // ── JULY 4 TALL SHIP ROUTE MARKERS ──────────────────────────────────────

  const july4Sites = [
    {
      lat: 40.7420, lng: -74.0103,
      name: "Little Island (Pier 55)",
      desc: "The Hudson's most architecturally striking park — a floating island of tulip-shaped concrete columns right on the water. Unobstructed views of the tall ships as they pass. Free entry, no reservation needed on July 4.",
      cost: "🟢 Free · Open 6AM–midnight"
    },
    {
      lat: 40.7772, lng: -73.9895,
      name: "Riverside Park South",
      desc: "Hudson River waterfront park from 59th to 72nd St. Bike and jogging paths right along the water with direct views of the parade. Less crowded than the Hudson River Park piers further south.",
      cost: "🟢 Free · Open 6AM–1AM"
    },
      desc: "Long continuous waterfront path from the GWB southward. Watch tall ships sail down the Hudson from multiple vantage points along the way.",
      cost: "🟢 Free · Open all day"
    },
    {
      lat: 40.7648, lng: -74.0002,
      name: "Hudson River Park — Piers 86–92 Area",
      desc: "The tall ship staging area. The surrounding Hudson River Park piers offer unobstructed waterfront views of the ships as they depart.",
      cost: "🟢 Free · Open all day"
    },
    {
      lat: 40.7342, lng: -74.0113,
      name: "Pier 46 — Hudson River Park",
      desc: "Grassy pier with stunning Hudson River views. One of the most popular summer spots in the city — arrive early on July 4.",
      cost: "🟢 Free · Open 6AM–1AM"
    },
    {
      lat: 40.7331, lng: -74.0125,
      name: "Pier 45 — Hudson River Park",
      desc: "Open lawn with benches and waterfront access. Great mid-route vantage point as tall ships head south toward the harbor.",
      cost: "🟢 Free · Open 6AM–1AM"
    },
    {
      lat: 40.7211, lng: -74.013,
      name: "Pier 26 — Hudson River Park (Tribeca)",
      desc: "Waterfront park near Tribeca with open lawn and river access. Ships pass close by on their southward route.",
      cost: "🟢 Free · Open 6AM–1AM"
    },
    {
      lat: 40.7053, lng: -74.0188,
      name: "Robert F. Wagner Jr. Park",
      desc: "Panoramic harbor views and Statue of Liberty sightlines at the southern tip of Manhattan. Reopened summer 2025 with new lawns and esplanade.",
      cost: "🟢 Free · Open 24 hours"
    },
    {
      lat: 40.7029, lng: -74.0154,
      name: "The Battery (Battery Park)",
      desc: "Iconic lower Manhattan waterfront park at the harbor entry. Tall ships pass directly by on their way into the Upper Bay.",
      cost: "🟢 Free · Open 6AM–1AM"
    }
  ];

  july4Sites.forEach(s => {
    L.marker([s.lat, s.lng], { icon: makeIcon(colors.july4) })
      .addTo(map)
      .bindPopup(popup(s.name, "July 4 — Tall Ship Parade", colors.july4, s.desc, s.cost));
  });

  // ── JULY 3 CLASS B ROUTE MARKERS ────────────────────────────────────────

  const july3Sites = [
    {
      lat: 40.7751, lng: -73.9437,
      name: "Carl Schurz Park (Upper East Side)",
      desc: "Beautiful east-side Manhattan park right on the East River at 86th St. The esplanade offers direct views of ships as they head south from Hell Gate. One of the most underrated waterfront parks in the city.",
      cost: "🟢 Free · Open 6AM–midnight"
    },
    {
      lat: 40.7691, lng: -73.9495,
      name: "John Jay Park (Upper East Side)",
      desc: "East River park at 77th St with good sightlines south along the river. Solid mid-route vantage point as ships pass through Midtown waters.",
      cost: "🟢 Free · Open 7AM–10PM"
    },
    {
      lat: 40.7423, lng: -73.9607,
      name: "Hunters Point South Park (Long Island City)",
      desc: "Stunning Queens-side waterfront park with sweeping East River and Manhattan skyline views — rated 4.8 stars. Ships pass directly in front on the July 3 route. The cantilevered overlook is spectacular.",
      cost: "🟢 Free · Open 6AM–10PM"
    },
    {
      lat: 40.7421, lng: -73.9605,
      name: "Gantry Plaza State Park (Long Island City)",
      desc: "Adjacent to Hunters Point South, this iconic Queens waterfront park features the historic Pepsi-Cola sign and direct East River access. One of the best views of the Manhattan skyline — and the July 3 parade.",
      cost: "🟢 Free · Open 8AM–10PM"
    },
      desc: "Prime vantage point right at the Hell Gate — where the Class B parade begins. The park sits directly on the East River with unobstructed views of the ships as they set sail. The Hell Gate Bridge frames the scene perfectly.",
      cost: "🟢 Free · Open 6AM–1AM"
    },
    {
      lat: 40.7681, lng: -73.9297,
      name: "Hallets Cove Waterfront (Astoria)",
      desc: "Small waterfront green space just south of Hell Gate in Astoria. Ships pass close to the Queens shoreline here early in the parade route.",
      cost: "🟢 Free · Open all day"
    },
    {
      lat: 40.7575, lng: -73.9496,
      name: "Roosevelt Island — Southern Tip",
      desc: "Four Freedoms Park at the southern tip of Roosevelt Island offers dramatic views down the East River. The Class B ships pass on both sides of the island. Free tram from Manhattan (or subway F train).",
      cost: "🟢 Free · Tram $2.90 each way"
    },
    {
      lat: 40.7282, lng: -73.9757,
      name: "East River Park (Lower East Side)",
      desc: "Long waterfront park on the Manhattan side of the East River. Ships pass directly by as they head south toward the harbor. Multiple vantage points along the 1.5-mile esplanade.",
      cost: "🟢 Free · Open 6AM–1AM"
    },
    {
      lat: 40.7056, lng: -74.0015,
      name: "South Street Seaport / Pier 17",
      desc: "The finish line of the July 3 Class B parade. The surrounding Seaport plaza and Fulton Street promenade are free and publicly accessible — watch the ships arrive from the waterfront boardwalk.",
      cost: "🟢 Free · Open 24 hours (plaza)"
    }
  ];

  july3Sites.forEach(s => {
    L.marker([s.lat, s.lng], { icon: makeIcon(colors.july3) })
      .addTo(map)
      .bindPopup(popup(s.name, "July 3 — Class B Parade", colors.july3, s.desc, s.cost));
  });

  // ── BOTH PARADES ─────────────────────────────────────────────────────────

  const bothSites = [
    {
      lat: 40.7022, lng: -73.9959,
      name: "Brooklyn Bridge Park",
      desc: "85-acre waterfront park with 1.3 miles of East River frontage. One of the best vantage points in the entire metro — sweeping views of the harbor, the Brooklyn Bridge, and Manhattan skyline. Ships on both parades are visible.",
      cost: "🟢 Free · Open 6AM–1AM"
    },
    {
      lat: 40.703, lng: -73.9956,
      name: "Brooklyn Bridge Park — Pier 1",
      desc: "The northern tip of Brooklyn Bridge Park. Up-close views of the harbor approach. Can see the Statue of Liberty. Ideal for both July 3 and July 4 parades.",
      cost: "🟢 Free · Open 24 hours"
    }
  ];

  bothSites.forEach(s => {
    L.marker([s.lat, s.lng], { icon: makeIcon(colors.both, 16) })
      .addTo(map)
      .bindPopup(popup(s.name, "Both Parades", colors.both, s.desc, s.cost));
  });

  // ── GOVERNORS ISLAND ────────────────────────────────────────────────────

  L.marker([40.6885, -74.0185], { icon: makeIcon(colors.govIsland, 16) })
    .addTo(map)
    .bindPopup(popup(
      "Governors Island",
      "July 3 — Best Harbor View",
      colors.govIsland,
      "Sits in the middle of the harbor with 360° views — tall ships surround the island. Picnic Point faces the Statue of Liberty and is spectacular. A bucket-list spot for this event.",
      "🟡 Ferry required — $5 round trip · Open 10AM–7PM (weekends)"
    ));

  // ── STAGING / ROUTE MARKERS ─────────────────────────────────────────────

  const stagingPoints = [
    { lat: 40.8517, lng: -73.9527, name: "GWB — July 4 Route Start", desc: "The Tall Ship Parade of Sail begins here and travels south through the Hudson River and into the harbor." },
    { lat: 40.6074, lng: -74.0573, name: "Verrazzano-Narrows Bridge — July 4 Route End", desc: "Southern terminus of the July 4 Tall Ship Parade route." },
    { lat: 40.7801, lng: -73.9274, name: "Hell Gate — July 3 Route Start", desc: "The Class B Tall Ship Parade sets sail from Hell Gate, heading south down the East River to South Street Seaport. Astoria Park, directly adjacent, offers the best shoreside view of the departure." },
    { lat: 40.7056, lng: -74.0015, name: "South Street Seaport — July 3 Route End", desc: "The Class B Tall Ship Parade concludes at South Street Seaport. The surrounding Seaport plaza and Fulton Street promenade are free and publicly accessible — making this both a prime viewing spot and the finish line." }
  ];

  stagingPoints.forEach(s => {
    L.marker([s.lat, s.lng], { icon: makeStarIcon(colors.staging) })
      .addTo(map)
      .bindPopup(`<div class="popup-title">${s.name}</div><div class="popup-body">${s.desc}</div>`);
  });

  // ── APPROXIMATE PARADE ROUTES ───────────────────────────────────────────

  // July 4 route: Verrazzano → Upper Bay → Hudson River (close to Manhattan shore) → GWB
  // Manhattan's west shore piers sit at approx -74.005 to -74.017
  // Route should be just west of that, in the river channel
  const july4Route = [
    [40.6074, -74.0500],  // Verrazzano mid-channel
    [40.6300, -74.0520],  // Upper Bay
    [40.6500, -74.0480],  // Upper Bay heading north
    [40.6700, -74.0400],  // Approaching Governors Island
    [40.6885, -74.0320],  // Past Governors Island
    [40.7000, -74.0220],  // Off Battery Park
    [40.7100, -74.0180],  // Hudson off Tribeca
    [40.7200, -74.0160],  // Hudson off Canal St
    [40.7330, -74.0140],  // Hudson off West Village / Pier 46
    [40.7450, -74.0130],  // Hudson off Chelsea
    [40.7560, -74.0100],  // Hudson off Piers 86–92
    [40.7700, -74.0020],  // Hudson off Upper West Side
    [40.7900, -73.9900],  // Hudson approaching GWB
    [40.8200, -73.9680],  // GWB approach
    [40.8517, -73.9527],  // George Washington Bridge
  ];

  L.polyline(july4Route, {
    color: colors.july4,
    weight: 3,
    opacity: 0.7,
    dashArray: '8, 6'
  }).addTo(map).bindTooltip("July 4 Tall Ship Route (approx.)", { sticky: true });

  // July 3 route: Hell Gate → down East River (Manhattan east shore) → South Street Seaport
  // East River along Manhattan's east shore runs approx -73.972 to -73.980
  const july3Route = [
    [40.7801, -73.9274],  // Hell Gate (precise)
    [40.7750, -73.9320],  // East River just south of Hell Gate
    [40.7681, -73.9380],  // Hallets Cove area
    [40.7575, -73.9480],  // Roosevelt Island / Queensboro Bridge
    [40.7450, -73.9580],  // Midtown East River
    [40.7350, -73.9650],  // East 30s waterfront
    [40.7282, -73.9720],  // East River Park / Lower East Side
    [40.7200, -73.9760],  // Williamsburg Bridge area
    [40.7130, -73.9780],  // Below Williamsburg Bridge
    [40.7056, -73.9980],  // South Street Seaport — END
  ];

  L.polyline(july3Route, {
    color: colors.july3,
    weight: 3,
    opacity: 0.7,
    dashArray: '8, 6'
  }).addTo(map).bindTooltip("July 3 Class B Route (approx.)", { sticky: true });

  // ── LEGEND ───────────────────────────────────────────────────────────────

  const legend = L.control({ position: 'bottomleft' });
  legend.onAdd = function() {
    const div = L.DomUtil.create('div', 'legend');
    div.innerHTML = `
      <h3>Viewing Key</h3>

      <div class="legend-item">
        <div class="legend-dot" style="background:${colors.july4}"></div>
        <span><strong style="color:${colors.july4}">July 4</strong> — Tall Ship Parade<br><span style="color:#8899aa;font-size:0.72rem">GWB → Lower Harbor · Free</span></span>
      </div>

      <div class="legend-item">
        <div class="legend-dot" style="background:${colors.july3}"></div>
        <span><strong style="color:${colors.july3}">July 3</strong> — Class B Parade<br><span style="color:#8899aa;font-size:0.72rem">Hell Gate → East River → Seaport · Free</span></span>
      </div>

      <div class="legend-item">
        <div class="legend-dot" style="background:${colors.both}"></div>
        <span><strong style="color:${colors.both}">Both Parades</strong> — Brooklyn Bridge Park<br><span style="color:#8899aa;font-size:0.72rem">Best overall vantage · Free</span></span>
      </div>

      <div class="legend-item">
        <div class="legend-dot" style="background:${colors.govIsland}"></div>
        <span><strong style="color:${colors.govIsland}">Governors Island</strong><br><span style="color:#8899aa;font-size:0.72rem">360° harbor views · $5 ferry</span></span>
      </div>

      <div class="legend-section">
        <div class="legend-item">
          <div class="legend-dot" style="background:${colors.staging};border-radius:3px;transform:rotate(45deg)"></div>
          <span style="color:#aab">Route start / end points</span>
        </div>
        <div class="legend-item">
          <div class="legend-line" style="background:${colors.july4};opacity:0.8"></div>
          <span style="color:#aab">Approximate parade routes</span>
        </div>
      </div>

      <div class="legend-note">
        ⚓ Routes are approximate. Confirm final<br>paths with <a href="https://sail4th.us" style="color:${colors.gold};text-decoration:none">sail4th.us</a> closer to the event.
      </div>
    `;
    return div;
  };
  legend.addTo(map);

  // ── TITLE CARD ───────────────────────────────────────────────────────────

  const titleCard = L.control({ position: 'topright' });
  titleCard.onAdd = function() {
    const div = L.DomUtil.create('div', 'legend');
    div.style.maxWidth = '200px';
    div.innerHTML = `
      <h3>About This Map</h3>
      <div style="font-size:0.74rem;color:#ccd;line-height:1.5">
        All <span style="color:${colors.july4}">●</span> and <span style="color:${colors.july3}">●</span> sites are <strong>free</strong> public parks and waterfront areas.
        <br><br>
        <span style="color:${colors.govIsland}">●</span> Governors Island requires a $5 round-trip ferry — worth it for the unmatched 360° harbor views.
        <br><br>
        Click any marker for details and access info.
      </div>
    `;
    return div;
  };
  titleCard.addTo(map);

</script>
</body>
</html>
